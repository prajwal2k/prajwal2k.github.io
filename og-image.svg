<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowTeal" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3FA7A0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3FA7A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="100%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowAmber)"/>

  <!-- eyebrow -->
  <circle cx="80" cy="96" r="5" fill="#6FCF97"/>
  <text x="98" y="101" font-family="'IBM Plex Mono', monospace" font-size="19" fill="#93A1B0">open to data engineering roles</text>

  <!-- name -->
  <text x="78" y="230" font-family="'IBM Plex Mono', monospace" font-size="64" font-weight="700" fill="#E8ECEF">Prajwal Arun Kumar</text>

  <!-- title -->
  <text x="80" y="278" font-family="'IBM Plex Mono', monospace" font-size="26" fill="#3FA7A0">Data Engineer</text>
  <text x="330" y="278" font-family="'IBM Plex Mono', monospace" font-size="26" fill="#5D6B7A">·</text>
  <text x="350" y="278" font-family="'IBM Plex Mono', monospace" font-size="26" fill="#D9A441">Pipelines, Cloud &amp; Applied AI</text>

  <!-- mini DAG -->
  <g font-family="'IBM Plex Mono', monospace" font-size="15" fill="#93A1B0">
    <!-- node 1 -->
    <rect x="80" y="420" width="150" height="64" rx="8" fill="#121822" stroke="#232c39"/>
    <text x="102" y="448" fill="#E8ECEF" font-weight="600">sources</text>
    <text x="102" y="468" fill="#5D6B7A" font-size="12">S3 · Kafka</text>

    <line x1="230" y1="452" x2="288" y2="452" stroke="#232c39" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="270" cy="452" r="3.5" fill="#3FA7A0"/>

    <!-- node 2 -->
    <rect x="288" y="420" width="150" height="64" rx="8" fill="#121822" stroke="#D9A441"/>
    <text x="310" y="448" fill="#E8ECEF" font-weight="600">spark</text>
    <text x="310" y="468" fill="#5D6B7A" font-size="12">batch + stream</text>

    <line x1="438" y1="452" x2="496" y2="452" stroke="#232c39" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="478" cy="452" r="3.5" fill="#3FA7A0"/>

    <!-- node 3 -->
    <rect x="496" y="420" width="150" height="64" rx="8" fill="#121822" stroke="#232c39"/>
    <text x="518" y="448" fill="#E8ECEF" font-weight="600">dbt</text>
    <text x="518" y="468" fill="#5D6B7A" font-size="12">staging → mart</text>

    <line x1="646" y1="452" x2="704" y2="452" stroke="#232c39" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="686" cy="452" r="3.5" fill="#3FA7A0"/>

    <!-- node 4 -->
    <rect x="704" y="420" width="170" height="64" rx="8" fill="#121822" stroke="#3FA7A0"/>
    <text x="726" y="448" fill="#E8ECEF" font-weight="600">bi + llm layer</text>
    <text x="726" y="468" fill="#5D6B7A" font-size="12">Power BI · LangChain</text>
  </g>

  <!-- bottom rule + stats -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#1a212c" stroke-width="1"/>
  <g font-family="'IBM Plex Mono', monospace">
    <text x="80" y="580" font-size="30" font-weight="700" fill="#E8ECEF">3<tspan fill="#D9A441">+</tspan></text>
    <text x="80" y="602" font-size="14" fill="#5D6B7A">years in data engineering</text>

    <text x="280" y="580" font-size="30" font-weight="700" fill="#E8ECEF">60<tspan fill="#D9A441">%</tspan></text>
    <text x="280" y="602" font-size="14" fill="#5D6B7A">query latency cut</text>

    <text x="480" y="580" font-size="30" font-weight="700" fill="#E8ECEF">80<tspan fill="#D9A441">%</tspan></text>
    <text x="480" y="602" font-size="14" fill="#5D6B7A">faster ad-hoc queries</text>

    <text x="1120" y="596" font-size="15" fill="#5D6B7A" text-anchor="end">prajwal2k.github.io</text>
  </g>
</svg>
